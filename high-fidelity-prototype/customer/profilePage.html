<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <link rel="stylesheet" href="profilePageStyles.css">
</head>
<body>
    <main class="container">

      <!-- Header Navagation  -->
    <header class="navbar">
        <div class="nav-container">
            <a href="#" class="siteTitle"><img class = logo src = "images/logo.png">TutorMatch</a>

            <span class="slogan">Find the right tutor for you</span>

            <nav><a href="mainPage.html">Home</a><a href="profilePage.html">Student Profile</a></nav>
        </div>
    </header>

        <div class="profile-layout">


            <!--Student Profile Sidebar-->
            <aside class="profile-sidebar">
                <div class="profile-picture">Profile Picture</div>
                <div class="profile-information">
                    <h1>John Doe</h1>
                    
                    <div class="profile-item">
                        <span class="profile-label">Grade Level</span>
                        <span>Junior</span>
                    </div>


                    <div class="profile-item">
                        <span class="profile-label">Topics</span>
                        <span>Math</span>
                        <span>Science</span>
                        <span>History</span>
                    </div>

                    <div class="profile-item">
                        <span class="profile-label">Date Joined</span>
                        <span>09/14/2026</span>
                    </div>
                </div>

                <a href="editPage.html" class="edit-button">Edit Profile</a>
            </aside>


            <!--Current Courses Section-->
                <section class="profile-tutors">
                    <div class="page-header">
                        <h1>Current Tutors</h1>
                </div>


                <div class="tutor-grid">

                    <!-- Card 1 -->
                    <a href="viewingPage.html">
                    <article class="tutor-card">
                    <div class="course-image"><img src="images/apple.png" alt="Course Image Description"></div>

                    <div class="tutor-info">
                        <h2>Intro to Brewing</h2>
                        <p class="tutorName">Jack Daniel</p>
                    </div>
                    </article>
                    </a>

                    <!-- Card 2 -->
                    <a href="viewingPage.html">
                    <article class="tutor-card">
                    <div class="course-image"><img src="images/apple.png" alt="Course Image Description"></div>

                    <div class="tutor-info">
                        <h2>Computer Repair</h2>
                        <p class="tutorName">Adam Shoop</p>
                    </div>
                    </article>
                    </a>

                </div>
            </section>

        </div>

    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-container">
            <p>Tutor Match</p>
        </div>
    </footer>
</body>
</html>
