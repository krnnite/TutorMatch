<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="createAccountPageStyles.css">
    
</head>
<body>
    <!-- Header Navagation  -->
    <header class="navbar">
        <div class="nav-container">
            <a href="#" class="siteTitle"><img class = logo src = "images/logo.png">TutorMatch</a>

            <span class="slogan">Find the right tutor for you</span>

            <nav><a href="mainPage.html">Home</a><a href="profilePage.html">Student Profile</a></nav>
        </div>
    </header>

    <!-- Main Page Content -->
<main class="container">

    <div class="editProfileBox">

        <h1>Create Account</h1>

        <div class="inputBoxes">

            <div class="inputGroup">
                <label for="editName">Name</label>
                <input 
                    type="text" 
                    id="editName"
                    class="editName"
                    placeholder="Enter your first and last name">
            </div>

            <div class="inputGroup">
                <label for="editLevel">Username</label>
                <input 
                    type="text" 
                    id="editLevel"
                    class="editLevel"
                    placeholder="Enter your Username">
            </div>

            <div class="inputGroup">
                <label for="editCourses">Courses</label>
                <input 
                    type="text" 
                    id="editCourses"
                    class="editCourses"
                    placeholder="Enter your course topics">
            </div>

            <div class="inputGroup">
                <label for="editCourses">Password</label>
                <input 
                    type="text" 
                    id="editCourses"
                    class="editCourses"
                    placeholder="Enter your Password">
            </div>

            <div class="inputGroup">
                <label for="editCourses">Confirm Password</label>
                <input 
                    type="text" 
                    id="editCourses"
                    class="editCourses"
                    placeholder="Re-Enter your Password">
            </div>

        </div>

        <div class="editButtons">
            <button type="button" class="confirmButton">OK</button>
            <button type="button" class="cancelButton">Clear</button>
        </div>

    </div>

</main>

<!-- Footer -->
    <footer>
        <div class="footer-container">
            <p>Tutor Match</p>
        </div>
    </footer>
    
</body>
</html>
