<!DOCTYPE html>

<html lang="en"> 
    <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <title>Login</title> <link rel="stylesheet" href="loginPageStyles.css"> </head>

<body>

<!-- Header Navagation  -->
    <header class="navbar">
        <div class="nav-container">
            <a href="#" class="siteTitle"><img class = logo src = "images/logo.png">TutorMatch</a>

            <span class="slogan">Find the right tutor for you</span>

            <nav><a href="mainPage.html">Home</a><a href="profilePage.html">Student Profile</a></nav>
        </div>
    </header>

<!-- Main Page Content -->
<main class="container">

    <div class="editProfileBox">

        <h1>Login</h1>

        <div class="inputBoxes">

            <div class="inputGroup">
                <label for="editName">Username</label>
                <input 
                    type="text" 
                    id="editName"
                    class="editName"
                    placeholder="Enter your Username">
            </div>

            <div class="inputGroup">
                <label for="editLevel">Password</label>
                <input 
                    type="text" 
                    id="editLevel"
                    class="editLevel"
                    placeholder="Enter your Password">
            </div>

        </div>

        <div class="editButtons">
            <a href = "mainPage.html"><button type="button" class="confirmButton">OK</button></a>
            <button type="button" class="cancelButton">Clear</button>
        </div>

    </div>

</main>

<!-- Footer -->
<footer>
    <div class="footer-container">
        <p>Tutor Match</p>
    </div>
</footer>

</body> </html>
