<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Student Home</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="../../css/header-footer.css">
        <link rel="stylesheet" href="../../css/homepage.css">
    </head>
    <body>
        <div class="d-flex flex-column min-vh-100">
            <!-- Header Navagation  -->
            <header class="sticky-top">
                <nav class="navbar tm-navbar">
                    <div class="container">
                        <div class="justify-content-start">
                            <a class="navbar-brand" href="../../index.html">
                                <img class="mr-lg-3" src="../../assets/flavicon/tutorMatch-32x32.png" alt="logo">
                                <span class="fw-bold">TutorMatch</span>
                            </a>
                            <span class="navbar-text d-none d-md-block tm-navbar-slogan">Match with Local Experts in Your Desired Field!</span>
                        </div>
                        <div class="justify-content-end">
                            <!---Navigation bar buttons-->
                            <ul class="nav nav-pills">
                                <li class="nav-item mx-3">
                                    <button type="button" class="btn btn-primary" onclick="location.href='customerHomepage.html'">Home</button>
                                </li>
                                <li class="nav-item">
                                    <button type="button" class="btn btn-primary" onclick="location.href='customerDashboard.html'">Student Profile</button>
                                </li>
                            </ul>
                        </div>
                    </div>
                </nav>
            </header>
            <!-- Main Content -->
            <main class="container flex-grow-1">
                <div class = "header-container">
                    <!-- Page Heading -->
                    <section class="page-header">
                        <h1>Available Tutors</h1>
                    </section>
                    <!-- Search Bar -->
                    <section class="search-section">
                        <input type="text" placeholder="Search...">
                        <button>Search</button>
                    </section>
                </div>
                <!-- Tutor Cards -->
                <section class="tutor-grid">
                    <!-- Card 1 -->
                    <a href="#">
                        <article class="tutor-card">

                                <img src="../../assets/media/apple.png" alt="Course Image Description">
                            </div>
                            <div class="tutor-info">
                                <h2>Intro to Chemisty</h2>
                                <p class="tutorName">Walter White</p>
                            </div>
                        </article>
                    </a>
                    <!-- Card 2 -->
                    <a href="#">
                        <article class="tutor-card">
                            <div class="course-image">
                                <img src="../../assets/media/apple.png" alt="Course Image Description">
                            </div>
                            <div class="tutor-info">
                                <h2>Basics of Python</h2>
                                <p class="tutorName">John Notasnake</p>
                            </div>
                        </article>
                    </a>
                    <!-- Card 3 -->
                    <a href="#">
                        <article class="tutor-card">
                            <div class="course-image">
                                <img src="../../assets/media/apple.png" alt="Course Image Description">
                            </div>
                            <div class="tutor-info">
                                <h2>Animation 101</h2>
                                <p class="tutorName">Tyler Brewstew</p>
                            </div>

                    </a>
                    <!-- Card 4 -->
                    <a href="#">
                        <article class="tutor-card">
                            <div class="course-image">
                                <img src="../../assets/media/apple.png" alt="Course Image Description">
                            </div>
                            <div class="tutor-info">
                                <h2>Game Design</h2>
                                <p class="tutorName">Nicholas Branscombe</p>
                            </div>
                        </article>

                    <!-- Card 5 -->
                    <a href="#">
                        <article class="tutor-card">
                            <div class="course-image">
                                <img src="../../assets/media/apple.png" alt="Course Image Description">
                            </div>
                            <div class="tutor-info">
                                <h2>Machining</h2>
                                <p class="tutorName">Gabe Simmons</p>
                            </div>
                        </article>
                    </a>
                    <!-- Card 6 -->
                    <a href="#">
                        <article class="tutor-card">
                            <div class="course-image">
                                <img src="../../assets/media/apple.png" alt="Course Image Description">
                            </div>
                            <div class="tutor-info">
                                <h2>Textiles Basics</h2>
                                <p class="tutorName">Noah Fonke</p>
                            </div>

                <nav class="pagination">
                    <a href="#" class="active">1</a>
                    <a href="#">2</a>
                    <a href="#">3</a>
                    <span>...</span>
                    <a href="#">10</a>
                    <a href="#">Next</a>

        <footer>
            <div class="footer-container">
                <p>Tutor Match</p>
            </div>
        </footer>
