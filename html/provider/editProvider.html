<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Edit Profile</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="../../css/header-footer.css">
        <link rel="stylesheet" href="../../css/dashboard/edit-profile.css">
    </head>
    <body>
        <div class="d-flex flex-column min-vh-100">
            <!-- Header Navagation  -->
            <header class="sticky-top">
                <nav class="navbar tm-navbar">
                    <div class="container">
                        <div class="justify-content-start">
                            <a class="navbar-brand" href="../../index.html">
                                <img class="mr-lg-3" src="../../assets/flavicon/tutorMatch-32x32.png" alt="logo">
                                <span class="fw-bold">TutorMatch</span>
                            </a>
                            <span class="navbar-text d-none d-md-block tm-navbar-slogan">Match with Local Experts in Your Desired Field!</span>
                        </div>
                        <div class="justify-content-end">
                            <!---Navigation bar buttons-->
                            <ul class="nav nav-pills">
                                <li class="nav-item mx-3">
                                    <button type="button" class="btn btn-primary">Home</button>
                                </li>
                                <li class="nav-item">
                                    <button type="button" class="btn btn-primary" onclick="location.href='providerDashboard.html'">Provider Profile</button>
                                </li>
                            </ul>
                        </div>
                    </div>
                </nav>
            </header>
            <!-- Main Page Content -->
            <main class="container flex-grow-1">
                <div class="editProfileBox">
                    <h1>Edit Profile</h1>
                    <div class="inputBoxes">
                        <div class="inputGroup">
                            <label for="editName">Name</label>
                            <input type="text" id="editName" class="editName" placeholder="Enter your first and last name">
                        </div>
                        <div class="inputGroup">
                            <label for="editLevel">Instruction Level</label>
                            <input type="text" id="editLevel" class="editLevel" placeholder="Enter your grade level">
                        </div>
                        <div class="inputGroup">
                            <label for="editCourses">Courses</label>
                            <input type="text" id="editCourses" class="editCourses" placeholder="Enter your course topics">
                        </div>
                    </div>
                    <div class="editButtons">
                        <button type="submit" class="confirmButton">Save Changes</button>
                        <button type="button" class="cancelButton">Cancel</button>
                    </div>
                </div>
            </main>
            <!-- Footer -->
            <footer>
                <div class="footer-container">
                    <p>Tutor Match</p>
                </div>
            </footer>
        </div>    
    </body>
</html>
