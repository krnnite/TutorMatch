<!DOCTYPE html>
<html lang=""> 
    <head>   
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link href="../css/boilerplate.css" rel="stylesheet">
        <meta name="description" content="">
    </head>
    <body>
        <header class="sticky-top">
            <nav class="navbar navbar-expand-lg tm-navbar">
                <div class="container-fluid">
                    <div class="justify-content-start">
                        <a class="navbar-brand" href="../index.html">
                            <img class="mr-lg-3" src="../assets/flavicon/tutorMatch-32x32.png" alt="logo">
                            <span class="fw-bold">TutorMatch</span>
                        </a>
                        <span class="navbar-text tm-navbar-slogan">Match with Local Experts in Your Desired Field!</span>
                    </div>
                    <div class="justify-content-end">
                        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
                            <span class="navbar-toggler-icon"></span>
                        </button>
                    </div>
                    <div class="collapse navbar-collapse mx-3 justify-content-end" id="navbarText">
                        <!---Navigation bar buttons-->
                        <ul class="nav nav-pills">
                            <li class="nav-item">
                                <a class="nav-link active mx-2" href="#">Student Login</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active mx-2 " href="providerLogin.html">Provider Login</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>
        <div class="container-fluid">
            <div class="row min-vh-100">
                <div class="col-2 tm-left-gutter"></div>
                <div class="col-8 d-flex justify-content-center align-items-center tm-main-container">
                    <h1 class="display-4 hero-title">Login</h1>
                </div>
                <div class="col-2 tm-right-gutter"></div>
                <div class="col-2 tm-left-gutter"></div>
                <div class="col-8 tm-main-container">
                    <!--Main page content goes within this tag-->
                    <main class="container mx-lg-5 tm-main">
                        <form>
                            <div class="form-group">
                                <label for="inputUsername">Username</label>
                                <input type="username" class="form-control" id="inputUsername" placeholder="Enter Username">
                            </div>
                            <div class="form-group">
                                <label for="inputPassword">Password</label>
                                <input type="password" class="form-control" id="inputPassword" aria-describedby="credentialsWarning" placeholder="Enter Password">
                                <small id="credentialsWarning" class="form-text text-muted">Never share your username or password with anyone else. We will never contact you for your credentials</small>
                            </div>
                            <button type="submit" class="btn btn-primary">OK</button>
                            <button type="reset" class="btn btn-secondary">Clear</button>
                        </form>
                        <p class="h6 mt-4">Don't have an account? <a href="providerDashboard.html"><span>Register today!</span></a></p>
                    </main>
                </div>
                <div class="col-2 tm-right-gutter"></div>
            </div>
        </div>
    </body>
</html>
