<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Course</title>
    <link rel="stylesheet" href="../../css/header-footer-c.css"
    <link rel="stylesheet" href="../../css/customer/viewingPageStyles.css">
</head>
<body>
    
    <!-- Header Navagation  -->
    <header class="navbar">
        <div class="nav-container">
            <a href="#" class="siteTitle"><img class = logo src = "images/logo.png">TutorMatch</a>

            <span class="slogan">Find the right tutor for you</span>

            <nav><a href="mainPage.html">Home</a><a href="profilePage.html">Student Profile</a></nav>
        </div>
    </header>

    <main class = container>
        
        <h1 class = courseName>Intro to Brewing</h1>
        <h2 class = tutorName>Tutor: Jack Daniel</h2>
        <p class = courseDescription>Description:
            Learn the basics from a master. This course will show you the ins and outs of brewing your own five star whisky!
            For fun only. Do not sell it without a liquor license.
        </p>

        <textarea class="reviewBox" placeholder="Input Review of this Course/Tutor"></textarea>
        <button class = reviewButton>Submit</button>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-container">
            <p>Tutor Match</p>
        </div>
    </footer>
    
</body>
</html>
