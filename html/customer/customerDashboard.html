<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>My Profile</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="../../css/header-footer.css">
        <link rel="stylesheet" href="../../css/dashboard/profile-sidebar.css">
        <link rel="stylesheet" href="../../css/dashboard/profile-cards.css">
    </head>
    <body>
        <div class="d-flex flex-column min-vh-100">
            <header class="sticky-top">
                <nav class="navbar tm-navbar">
                    <div class="container">
                        <div class="justify-content-start">
                            <a class="navbar-brand" href="../../index.html">
                                <img class="mr-lg-3" src="../../assets/flavicon/tutorMatch-32x32.png" alt="logo">
                                <span class="fw-bold">TutorMatch</span>
                            </a>
                            <span class="navbar-text d-none d-md-block tm-navbar-slogan">Match with Local Experts in Your Desired Field!</span>
                        </div>
                        <div class="justify-content-end">
                            <!---Navigation bar buttons-->
                            <ul class="nav nav-pills">
                                <li class="nav-item mx-3">
                                    <button type="button" class="btn btn-primary" onclick="location.href='customerHomepage.html'">Home</button>
                                </li>
                                <li class="nav-item">
                                    <button type="button" class="btn btn-primary" onclick="location.href='customerDashboard.html'">Student Profile</button>
                                </li>
                            </ul>
                        </div>
                    </div>
                </nav>
            </header>
            <main class="container flex-grow-1">
            <!-- Header Navagation  -->
                <div class="profile-layout">
                    <!--Student Profile Sidebar-->
                    <aside class="profile-sidebar">
                        <div class="profile-picture">Profile Picture</div>
                        <div class="profile-information">
                            <h1>John Doe</h1>
                            <div class="profile-item">
                                <span class="profile-label">Grade Level</span>
                                <span>Junior</span>
                            </div>
                            <div class="profile-item">
                                <span class="profile-label">Topics</span>
                                <span>Math</span>
                                <span>Science</span>
                                <span>History</span>
                            </div>
                            <div class="profile-item">
                                <span class="profile-label">Date Joined</span>
                                <span>09/14/2026</span>
                            </div>
                        </div>
                        <a href="editCustomer.html" class="edit-button">Edit Profile</a>
                    </aside>
                    <!--Current Courses Section-->
                    <section>
                        <div>
                            <h1>Current Tutors</h1>
                        </div>
                        <div class="dashboard-grid">
                            <!-- Card 1 -->
                            <a href="viewingPage.html">
                                <article class="dashboard-card">
                                <div class="card-image"><img src="../../assets/media/apple.png" alt="Course Image Description"></div>
                                <div class="card-info">
                                    <h2>Intro to Brewing</h2>
                                    <p class="card-name">Jack Daniel</p>
                                </div>
                                </article>
                            </a>
                            <!-- Card 2 -->
                            <a href="viewingPage.html">
                                <article class="dashboard-card">
                                <div class="card-image"><img src="../../assets/media/apple.png" alt="Course Image Description"></div>

                                <div class="card-info">
                                    <h2>Computer Repair</h2>
                                    <p class="card-name">Adam Shoop</p>
                                </div>
                                </article>
                            </a>
                        </div>
                    </section>
                </div>
            </main>
            <!-- Footer -->
            <footer>
                <div class="footer-container">
                    <p>Tutor Match</p>
                </div>
            </footer>
        </div>
    </body>
</html>
